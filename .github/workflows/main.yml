name: Jolin - Cinema Testing CA1

on: push

jobs:
  cinema-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Display Student
        run: echo "Student - Jolin Tang"

      - name: Display Module
        run: echo "Module - C339 Software Testing and Analytics"

      - name: Display Project
        run: echo "Cinema Ticket Pricing and Screening Eligibility"

      - name: Display Message
        run: echo "My Cinema GitHub Actions workflow is running automatically."

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: Install Pytest
        run: python -m pip install pytest

      - name: Run Cinema Test Cases
        run: python -m pytest -v
